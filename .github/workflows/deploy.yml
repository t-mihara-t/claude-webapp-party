name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: ls -la dist/

      - name: Setup D1 database
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 create nomi-kai-db
        continue-on-error: true

      - name: Get D1 database list
        id: d1_list
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 list --json
        continue-on-error: true

      - name: Configure wrangler.toml
        id: configure
        env:
          D1_OUTPUT: ${{ steps.d1_list.outputs.command-output }}
          D1_OUTCOME: ${{ steps.d1_list.outcome }}
        run: |
          DB_ID=""
          if [ "$D1_OUTCOME" == "success" ] && [ -n "$D1_OUTPUT" ]; then
            DB_ID=$(node -e "
              try {
                const data = JSON.parse(process.env.D1_OUTPUT);
                const db = data.find(d => d.name === 'nomi-kai-db');
                if (db) console.log(db.uuid);
              } catch(e) {}
            " 2>/dev/null)
          fi

          if [ -n "$DB_ID" ]; then
            echo "Found D1 database ID: $DB_ID"
            sed -i "s/database_id = \"placeholder\"/database_id = \"$DB_ID\"/" wrangler.toml
            echo "d1_ready=true" >> $GITHUB_OUTPUT
          else
            echo "WARNING: D1 database not found. Removing D1 binding to allow deployment."
            echo "You can configure D1 binding later in the Cloudflare dashboard."
            sed -i '/\[\[d1_databases\]\]/,/^$/d' wrangler.toml
            echo "d1_ready=false" >> $GITHUB_OUTPUT
          fi

          echo "--- Final wrangler.toml ---"
          cat wrangler.toml

      - name: Run D1 schema migration
        if: steps.configure.outputs.d1_ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute nomi-kai-db --remote --file=./schema.sql
        continue-on-error: true

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=nomi-kai-manager
